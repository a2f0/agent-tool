name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun test
      - run: bun scripts/smoke-package.ts
      - run: bun run build
      - run: git diff --exit-code -- src/skills/bundled.ts
      - run: bun scripts/smoke.ts dist/agent-tool
      - if: runner.os == 'Linux'
        run: scripts/package-deb.sh dist/agent-tool amd64
      - if: runner.os == 'Linux'
        run: dpkg-deb --info dist/*.deb && dpkg-deb --contents dist/*.deb
