name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jdx/mise-action@9b200bcecbfd6303e69a4a261b2e09e3757440a7 # v5.2.0
        with:
          version: 2026.10.13
          install_args: bun
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun test
      - run: bun scripts/smoke-package.ts
      - run: bun run build
      - run: git diff --exit-code -- src/skills/bundled.ts
      - run: bun scripts/smoke.ts dist/agent-tool
      - if: runner.os == 'Linux'
        run: scripts/package-deb.sh dist/agent-tool amd64
      - if: runner.os == 'Linux'
        run: dpkg-deb --info dist/*.deb && dpkg-deb --contents dist/*.deb
      - name: Set minimum supported runtime
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.11
      - name: Check minimum runtime package, command runner, plan guard, and images
        run: bun scripts/smoke-package.ts && bun test src/commands src/dependencies src/images src/review/diagnostics.test.ts
