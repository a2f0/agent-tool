name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jdx/mise-action@8418fedb1110381a0d3ba51a7a415d7c1b884550 # v5.2.2
        with:
          version: 2026.10.17
          install_args: bun
      - run: bun install --frozen-lockfile
      - if: github.ref_type == 'branch'
        run: bun src/index.ts branch check "${GITHUB_HEAD_REF:-$GITHUB_REF_NAME}"
      - run: bun run typecheck
      - run: bun src/index.ts graph check
      - run: bun test --parallel
      - run: bun scripts/testing/smoke-package.ts
      - run: bun run build
      - run: git diff --exit-code -- src/skills/bundled.ts
      - run: bun scripts/testing/smoke.ts dist/agent-tool
      - if: runner.os == 'Linux'
        run: scripts/release/package-deb.sh dist/agent-tool amd64
      - if: runner.os == 'Linux'
        run: dpkg-deb --info dist/*.deb && dpkg-deb --contents dist/*.deb
      - name: Set minimum supported runtime
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.11
      - name: Check minimum runtime package and shared workflows
        run: |
          test "$(bun --version)" = "1.3.11"
          bun scripts/testing/smoke-package.ts
          bun test src/commands src/dependencies src/graph src/images src/workflows src/release src/review/diagnostics.test.ts
