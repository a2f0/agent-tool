name: Publish npm package

# Publishes @a2f0/agent-tool with npm trusted publishing: npm exchanges the
# job's GitHub OIDC token for a short-lived publish token and attaches
# provenance, so no npm token or one-time password is stored anywhere. The
# trusted publisher on npmjs.com names this file and the `npm` environment.
# ship-pr bumps package.json on every merge that changes the package.
on:
  push:
    branches: [main]
    paths:
      - package.json
      - .github/workflows/npm-publish.yml
  workflow_dispatch:

permissions: {}

# Publish one version at a time, and never cancel a publish in progress.
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  # Dependencies and tests run without id-token, so no code they execute can
  # request the token npm exchanges for publish rights.
  check:
    name: Check @a2f0/agent-tool
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      publish: ${{ steps.decide.outputs.publish }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.21.0
          package-manager-cache: false
      # Publish only a version newer than npm's latest, so merges that keep the
      # version, re-runs, and out-of-order runs succeed without publishing.
      - id: decide
        run: bun scripts/npm-publish-decision.ts
      - if: steps.decide.outputs.publish == 'true'
        run: bun install --frozen-lockfile
      - if: steps.decide.outputs.publish == 'true'
        run: bun run typecheck && bun test && bun scripts/smoke-package.ts
      # The package ships src/skills/bundled.ts, so it must match skills/.
      - if: steps.decide.outputs.publish == 'true'
        run: bun run generate && git diff --exit-code -- src/skills/bundled.ts

  publish:
    name: Publish @a2f0/agent-tool
    needs: check
    if: needs.check.outputs.publish == 'true'
    runs-on: ubuntu-latest
    # Restricted to main in the repository settings, so a workflow edited on
    # another branch cannot obtain a token npm accepts.
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Trusted publishing needs npm 11.5.1 or later; Node 24.21.0 ships 11.19.0.
      # No registry-url: its .npmrc would point npm at an empty NODE_AUTH_TOKEN.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.21.0
          package-manager-cache: false
      # The source package needs no install or build, and scripts never run.
      - run: npm publish --ignore-scripts
