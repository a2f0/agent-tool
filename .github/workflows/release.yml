name: Release artifacts
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11
      - run: bun install --frozen-lockfile
      - run: bun run typecheck && bun test
      - run: bun scripts/release.ts "$GITHUB_REPOSITORY"
      - run: |
          version=$(bun -p 'require("./package.json").version')
          scripts/package-deb.sh "dist/agent-tool-$version-linux-x64/bin/agent-tool" amd64
          scripts/package-deb.sh "dist/agent-tool-$version-linux-arm64/bin/agent-tool" arm64
          cd dist
          sha256sum *.tar.gz *.deb > SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: agent-tool-release
          path: |
            dist/*.tar.gz
            dist/*.deb
            dist/SHA256SUMS
            dist/agent-tool.rb
