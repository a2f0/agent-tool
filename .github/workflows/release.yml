name: Release artifacts
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jdx/mise-action@9b200bcecbfd6303e69a4a261b2e09e3757440a7 # v5.2.0
        with:
          version: 2026.10.13
          install_args: bun
      - run: bun install --frozen-lockfile
      - run: bun run typecheck && bun test
      - run: bun scripts/release.ts "$GITHUB_REPOSITORY"
      - run: |
          version=$(bun -p 'require("./package.json").version')
          scripts/package-deb.sh "dist/agent-tool-$version-linux-x64/bin/agent-tool" amd64
          scripts/package-deb.sh "dist/agent-tool-$version-linux-arm64/bin/agent-tool" arm64
          cd dist
          sha256sum *.tar.gz *.deb > SHA256SUMS
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: agent-tool-release
          path: |
            dist/*.tar.gz
            dist/*.deb
            dist/SHA256SUMS
            dist/agent-tool.rb
